name: FilterKit Manual Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target jailbreak environment. Only RootHide is closed-loop; Rootless/Both profiles are not registered and that route remains unverified.
        required: true
        type: choice
        options: [RootHide, Rootless, Both]
        default: RootHide
      profile:
        description: Registered ElleKit reference profile (not a device compatibility certification). Only the RootHide profile is registered.
        required: true
        type: choice
        options: [Auto, roothide-dopamine-ellekit-1.2-3-16e3e7e]
        default: Auto
      configuration:
        description: Build configuration
        required: true
        type: choice
        options: [Debug, Release]
        default: Release
      architecture:
        description: Device architecture label (the installable iOS app payload is built as arm64)
        required: true
        type: choice
        options: [arm64, arm64e]
        default: arm64
      run_tests:
        description: Run tests before build
        required: true
        type: choice
        options: [Yes, No]
        default: No
      package:
        description: Output package format. DEB/Both are supported for RootHide only; the Rootless route (including IPA/None) is not yet closed-loop.
        required: true
        type: choice
        options: [DEB, IPA, Both, None]
        default: None
      clean_build:
        description: Clean DerivedData before build
        required: true
        type: choice
        options: [Yes, No]
        default: Yes

jobs:
  select-environments:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          env_in="${{ inputs.environment }}"
          pkg="${{ inputs.package }}"
          if [[ "$pkg" == "DEB" || "$pkg" == "Both" ]]; then
            if [[ "$env_in" != "RootHide" ]]; then
              echo "ERROR: package '$pkg' supports RootHide only; the '$env_in' DEB layout is unverified and no Rootless profile is registered. Select RootHide for DEB/Both; the Rootless route (any package format) remains pending." >&2
              exit 30
            fi
          fi
      - id: set
        shell: bash
        run: |
          if [[ "${{ inputs.environment }}" == "Both" ]]; then echo 'matrix={"environment":["RootHide","Rootless"]}' >> "$GITHUB_OUTPUT"; else echo 'matrix={"environment":["${{ inputs.environment }}"]}' >> "$GITHUB_OUTPUT"; fi

  build:
    needs: select-environments
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-environments.outputs.matrix) }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Validate package/environment compatibility
        if: inputs.package == 'DEB' || inputs.package == 'Both'
        shell: bash
        run: |
          if [[ "${{ matrix.environment }}" != "RootHide" ]]; then
            echo "ERROR: package '${{ inputs.package }}' supports RootHide only; the '${{ matrix.environment }}' DEB layout is unverified and no Rootless profile is registered. Select RootHide for DEB/Both; the Rootless route (any package format) remains pending." >&2
            exit 30
          fi
      - name: Select Xcode
        run: xcode-select -p && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install Debian packaging tools
        if: inputs.package == 'DEB' || inputs.package == 'Both'
        run: brew install dpkg
      - name: Install RootHide signing tool
        if: inputs.package == 'DEB' || inputs.package == 'Both'
        run: brew install ldid
      - name: Verify Debian packaging pipeline
        if: inputs.package == 'DEB' || inputs.package == 'Both'
        run: bash Build/Scripts/test-deb-packaging.sh
      - name: Build and package
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PROFILE: ${{ inputs.profile }}
          CONFIGURATION: ${{ inputs.configuration }}
          ARCHITECTURE: ${{ inputs.architecture }}
          RUN_TESTS: ${{ inputs.run_tests == 'Yes' && 'true' || 'false' }}
          PACKAGE: ${{ inputs.package }}
          CLEAN_BUILD: ${{ inputs.clean_build == 'Yes' && 'true' || 'false' }}
        run: bash Build/Scripts/ci-build.sh
      - name: Upload build outputs and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FilterKit-${{ matrix.environment }}-${{ inputs.configuration }}-${{ inputs.architecture }}
          path: Build/Output/${{ matrix.environment }}/
          if-no-files-found: warn
