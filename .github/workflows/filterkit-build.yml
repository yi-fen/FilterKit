# FilterKit CI — Stage 2.1-B macOS Build Validation
#
# 基线：GitHub Actions，runner macos-latest；Node 仅用于 CI 脚本/打包，不进入 App 运行时。
# 触发方式：**仅手动触发**（workflow_dispatch）；push / pull_request 不自动构建。
# 所有构建/测试结论必须以 macOS runner 实际日志为准，YAML 合法不代表构建通过。
#
# 待定值（Stage-2.1 子规格 §14）：Deployment Target（B2）、Bundle ID（B3）、
# UI 框架（B4）；工程草案取值见 project.yml，未取得链接/真机证据前不冻结。

name: filterkit-build

on:
  workflow_dispatch:

jobs:
  environment:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Record toolchain versions
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version
          xcodebuild -showsdks || true

  build:
    runs-on: macos-latest
    needs: environment
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build non-UI targets (Models / Adapters / Core)
        run: |
          set -o pipefail
          mkdir -p .build
          swift build 2>&1 | tee .build/swift-build.log
      - name: Upload non-UI build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filterkit-non-ui-build
          path: .build/swift-build.log
          retention-days: 14

  test:
    runs-on: macos-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run full Swift test suite
        run: |
          set -o pipefail
          mkdir -p .build
          swift test 2>&1 | tee .build/test-log.txt
      - name: Run S1-05 pairing mapping tests (independent filter)
        run: |
          set -o pipefail
          mkdir -p .build
          swift test --filter PluginPairingS105FixtureTests 2>&1 | tee .build/test-log-s105.txt
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filterkit-test-log
          path: |
            .build/test-log.txt
            .build/test-log-s105.txt
          retention-days: 14

  isolation:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Adapter isolation check
        run: |
          set -o pipefail
          mkdir -p build
          ISOLATION_SUMMARY_PATH=build/isolation-summary.json \
            bash scripts/check-adapter-isolation.sh 2>&1 | tee build/isolation-output.log
      - name: Upload isolation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filterkit-isolation
          path: |
            build/isolation-output.log
            build/isolation-summary.json
          retention-days: 14

  # ── 0.1-D-R4-A：iOS Device Build（未签名 iphoneos 设备产物；区别于模拟器切片）──
  # 边界：CODE_SIGNING_ALLOWED=NO 离线构建；只证明生成 iPhoneOS 设备产物，
  # 不证明可安装 / 可启动 / 权限放行；模拟器产物不得作为设备构建证据。
  device-build:
    runs-on: macos-latest
    needs: [build, isolation]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app for iOS device (Release, unsigned)
        run: |
          set -o pipefail
          mkdir -p build/device
          xcodebuild -project FilterKit.xcodeproj -scheme FilterKit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-device \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build/device/device-xcodebuild.log
      - name: Locate device app
        id: app
        run: |
          APP_PATH=$(find build/DerivedData-device/Build/Products -name 'FilterKit.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::FilterKit.app not found under build/DerivedData-device"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Built device app: $APP_PATH"
          ls -la "$APP_PATH"
          # 输出版本/构建号，便于在打包阶段之前核对 App 侧版本（CFBundleShortVersionString / CFBundleVersion）。
          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              info = plistlib.load(f)
          print("App marketing version (CFBundleShortVersionString):", info.get('CFBundleShortVersionString', '<empty>'))
          print("App build number (CFBundleVersion):", info.get('CFBundleVersion', '<empty>'))
          PY
      - name: Stage app bundle into evidence directory
        # .app 同时作为可读证据保留；实际下游打包使用权限保真的 TAR。
        # ditto 在 macOS 上比普通 cp 更适合复制 App Bundle 元数据和符号链接。
        run: |
          set -euo pipefail
          rm -rf build/device/FilterKit.app
          ditto "${{ steps.app.outputs.app_path }}" build/device/FilterKit.app
      - name: Verify and create permission-preserving App archive
        shell: bash
        run: |
          set -euo pipefail
          APP="build/device/FilterKit.app"
          INFO="$APP/Info.plist"
          if [[ ! -f "$INFO" ]]; then
            echo "::error::Staged App is missing Info.plist"
            exit 1
          fi
          EXECUTABLE="$(python3 - "$INFO" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              value = plistlib.load(f).get('CFBundleExecutable', '')
          if not isinstance(value, str) or not value or '/' in value or value in ('.', '..'):
              raise SystemExit('Invalid CFBundleExecutable')
          print(value)
          PY
          )"
          SOURCE_EXECUTABLE="${{ steps.app.outputs.app_path }}/$EXECUTABLE"
          STAGED_EXECUTABLE="$APP/$EXECUTABLE"
          if [[ ! -f "$SOURCE_EXECUTABLE" || ! -x "$SOURCE_EXECUTABLE" ]]; then
            echo "::error::Xcode source executable is missing or not executable: $SOURCE_EXECUTABLE"
            ls -l "$SOURCE_EXECUTABLE" 2>/dev/null || true
            exit 1
          fi
          if [[ ! -f "$STAGED_EXECUTABLE" || ! -x "$STAGED_EXECUTABLE" ]]; then
            echo "::error::Staged executable lost execute permission: $STAGED_EXECUTABLE"
            ls -l "$STAGED_EXECUTABLE" 2>/dev/null || true
            exit 1
          fi
          SOURCE_MODE="$(stat -f '%Lp' "$SOURCE_EXECUTABLE")"
          STAGED_MODE="$(stat -f '%Lp' "$STAGED_EXECUTABLE")"
          if [[ "$SOURCE_MODE" != "$STAGED_MODE" ]]; then
            echo "::error::ditto changed executable mode: source=$SOURCE_MODE staged=$STAGED_MODE"
            exit 1
          fi
          echo "Source executable mode: $SOURCE_MODE"
          echo "Staged executable mode: $STAGED_MODE"
          mkdir -p build/device
          ARCHIVE="build/device/FilterKit-device-app.tar.gz"
          rm -f "$ARCHIVE"
          tar -czpf "$ARCHIVE" -C build/device FilterKit.app
          tar -tzf "$ARCHIVE" >/dev/null
          RESTORE_DIR="$(mktemp -d)"
          trap 'rm -rf "$RESTORE_DIR"' EXIT
          tar -xzpf "$ARCHIVE" -C "$RESTORE_DIR"
          RESTORED_EXECUTABLE="$RESTORE_DIR/FilterKit.app/$EXECUTABLE"
          if [[ ! -f "$RESTORED_EXECUTABLE" || ! -x "$RESTORED_EXECUTABLE" ]]; then
            echo "::error::TAR round-trip did not preserve executable permission"
            ls -l "$RESTORED_EXECUTABLE" 2>/dev/null || true
            exit 1
          fi
          RESTORED_MODE="$(stat -f '%Lp' "$RESTORED_EXECUTABLE")"
          if [[ "$SOURCE_MODE" != "$RESTORED_MODE" ]]; then
            echo "::error::TAR round-trip changed executable mode: source=$SOURCE_MODE restored=$RESTORED_MODE"
            exit 1
          fi
          echo "Permission-preserving archive verified: $ARCHIVE"
          ls -lh "$ARCHIVE"
      - name: Validate device build statically
        run: |
          set -o pipefail
          mkdir -p build/device
          APP_PATH="${{ steps.app.outputs.app_path }}" \
          PACKAGE_VALIDATION_SUMMARY_PATH=build/device/device-build-summary.json \
            bash scripts/validate-device-build.sh 2>&1 | tee build/device/device-build-validation.log
      - name: Upload device build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filterkit-device-build
          path: |
            build/device/device-xcodebuild.log
            build/device/device-build-validation.log
            build/device/device-build-summary.json
            build/device/FilterKit.app
            build/device/FilterKit-device-app.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ── 0.1-D-R4-B：Signing & Entitlements 静态准备 ──
  # 此 job 只校验声明文件；真正 ldid 签名在 package-deb job 对 device App 副本执行。
  signing-prep:
    runs-on: macos-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate entitlements statically
        run: |
          set -o pipefail
          mkdir -p build/signing
          PACKAGE_VALIDATION_SUMMARY_PATH=build/signing/entitlements-summary.json \
            bash scripts/validate-entitlements.sh 2>&1 | tee build/signing/entitlements-validation.log
      - name: Upload signing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filterkit-signing-prep
          path: |
            build/signing/entitlements-validation.log
            build/signing/entitlements-summary.json
            Config/Signing/
          retention-days: 14

  # ── 0.1-D-R4-C：IPA 结构打包（未签名结构包，不标可安装）──
  package-ipa:
    runs-on: macos-latest
    needs: [device-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download device app artifact
        uses: actions/download-artifact@v7
        with:
          name: filterkit-device-build
          path: build/device-artifact
      - name: Restore App Bundle from permission-preserving archive
        id: app
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="build/device-artifact/FilterKit-device-app.tar.gz"
          RESTORE_DIR="build/device-restored"
          APP_PATH="$RESTORE_DIR/FilterKit.app"
          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::Permission-preserving App archive missing: $ARCHIVE"
            exit 1
          fi
          mkdir -p "$RESTORE_DIR"
          tar -xzpf "$ARCHIVE" -C "$RESTORE_DIR"
          if [[ ! -d "$APP_PATH" || ! -f "$APP_PATH/Info.plist" ]]; then
            echo "::error::Restored FilterKit.app is incomplete"
            exit 1
          fi
          EXECUTABLE="$(python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              value = plistlib.load(f).get('CFBundleExecutable', '')
          if not isinstance(value, str) or not value or '/' in value or value in ('.', '..'):
              raise SystemExit('Invalid CFBundleExecutable')
          print(value)
          PY
          )"
          if [[ ! -f "$APP_PATH/$EXECUTABLE" || ! -x "$APP_PATH/$EXECUTABLE" ]]; then
            echo "::error::Restored CFBundleExecutable is missing or not executable: $APP_PATH/$EXECUTABLE"
            ls -l "$APP_PATH/$EXECUTABLE" 2>/dev/null || true
            exit 1
          fi
          stat -f '%Sp %Lp %N' "$APP_PATH/$EXECUTABLE"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Restored App Bundle: $APP_PATH"
      - name: Package IPA structure (unsigned)
        run: |
          set -o pipefail
          mkdir -p build/ipa
          APP_PATH="${{ steps.app.outputs.app_path }}" \
          OUT_IPA=build/ipa/FilterKit.ipa \
            bash scripts/package-ipa.sh 2>&1 | tee build/ipa/package-ipa.log
      - name: Validate IPA structure
        run: |
          set -o pipefail
          mkdir -p build/ipa
          IPA_PATH=build/ipa/FilterKit.ipa \
          PACKAGE_VALIDATION_SUMMARY_PATH=build/ipa/ipa-summary.json \
            bash scripts/validate-ipa.sh 2>&1 | tee build/ipa/ipa-validation.log
      - name: Upload IPA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filterkit-ipa
          path: |
            build/ipa/package-ipa.log
            build/ipa/ipa-validation.log
            build/ipa/ipa-summary.json
            build/ipa/FilterKit.ipa
          retention-days: 14

  # ── 0.1-D-R4-D：DEB 测试包打包（RootHide 结构对照；不真机部署）──
  package-deb:
    runs-on: macos-latest
    needs: [device-build, signing-prep]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install ldid and dpkg tooling
        run: |
          set -euo pipefail
          mkdir -p build/deb
          if ! command -v ldid >/dev/null 2>&1; then brew install ldid; fi
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi
          command -v ldid | tee build/deb/ldid-toolchain.log
          brew list --versions ldid | tee -a build/deb/ldid-toolchain.log
          dpkg-deb --version | head -1 | tee -a build/deb/ldid-toolchain.log
          command -v otool | tee -a build/deb/ldid-toolchain.log
          command -v file | tee -a build/deb/ldid-toolchain.log
          python3 --version | tee -a build/deb/ldid-toolchain.log
      - name: Download device app artifact
        uses: actions/download-artifact@v7
        with:
          name: filterkit-device-build
          path: build/device-artifact
      - name: Restore App Bundle from permission-preserving archive
        id: app
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="build/device-artifact/FilterKit-device-app.tar.gz"
          RESTORE_DIR="build/device-restored"
          APP_PATH="$RESTORE_DIR/FilterKit.app"
          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::Permission-preserving App archive missing: $ARCHIVE"
            exit 1
          fi
          mkdir -p "$RESTORE_DIR"
          tar -xzpf "$ARCHIVE" -C "$RESTORE_DIR"
          if [[ ! -d "$APP_PATH" || ! -f "$APP_PATH/Info.plist" ]]; then
            echo "::error::Restored FilterKit.app is incomplete"
            exit 1
          fi
          EXECUTABLE="$(python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              value = plistlib.load(f).get('CFBundleExecutable', '')
          if not isinstance(value, str) or not value or '/' in value or value in ('.', '..'):
              raise SystemExit('Invalid CFBundleExecutable')
          print(value)
          PY
          )"
          if [[ ! -f "$APP_PATH/$EXECUTABLE" || ! -x "$APP_PATH/$EXECUTABLE" ]]; then
            echo "::error::Restored CFBundleExecutable is missing or not executable: $APP_PATH/$EXECUTABLE"
            ls -l "$APP_PATH/$EXECUTABLE" 2>/dev/null || true
            exit 1
          fi
          stat -f '%Sp %Lp %N' "$APP_PATH/$EXECUTABLE"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Restored App Bundle: $APP_PATH"
      - name: Sign App Mach-O images with ldid and verify embedded entitlements
        env:
          LDID_SIGNATURE_SUMMARY_PATH: build/deb/app-signature-summary.json
        run: |
          set -euo pipefail
          mkdir -p build/deb
          APP_PATH="${{ steps.app.outputs.app_path }}" \
            bash scripts/sign-app-ldid.sh 2>&1 | tee build/deb/ldid-signing.log
      - name: Package default RootHide signed-candidate DEB
        id: deb
        run: |
          set -euo pipefail
          mkdir -p build/deb
          VERSION="$(awk -F': *' '$1 == "Version" {print $2; exit}' Config/DEB/control | tr -d '\r')"
          VERSION_BASE="$(printf '%s' "$VERSION" | sed -E 's/-[0-9]+$//')"
          echo "Control Version: $VERSION (base $VERSION_BASE)"
          DEB_PATH="build/deb/filterkit_${VERSION}_iphoneos-arm64e.ldid-signed-candidate.deb"
          APP_PATH="${{ steps.app.outputs.app_path }}" \
          DEB_PROFILE_ID=roothide-rootfs \
          REQUIRE_LDID_SIGNATURE=1 \
          OUT_DEB="$DEB_PATH" \
            bash scripts/package-deb.sh 2>&1 | tee build/deb/package-deb.log
          echo "deb_path=$DEB_PATH" >> "$GITHUB_OUTPUT"
      - name: Validate RootHide DEB package
        env:
          SOURCE_APP_PATH: ${{ steps.app.outputs.app_path }}
          DEB_PATH: ${{ steps.deb.outputs.deb_path }}
          DEB_PROFILE_ID: roothide-rootfs
          REQUIRE_DEB_VALIDATION_TOOLS: '1'
          REQUIRE_LDID_SIGNATURE: '1'
          PACKAGE_VALIDATION_SUMMARY_PATH: build/deb/deb-summary.json
        run: |
          set -euo pipefail
          mkdir -p build/deb
          bash scripts/validate-deb.sh 2>&1 | tee build/deb/deb-validation.log
      - name: Upload DEB evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filterkit-deb
          path: |
            build/deb/ldid-toolchain.log
            build/deb/package-deb.log
            build/deb/ldid-signing.log
            build/deb/app-signature-summary.json
            build/deb/deb-validation.log
            build/deb/deb-summary.json
            build/deb/*.ldid-signed-candidate.deb
          retention-days: 14

  # ── 0.1-D-R4-E：静态校验汇总、SHA256 与构建元数据归档 ──
  # 状态口径：Build Passed / RootHide DEB Signed Candidate Passed (Static) / Device Install Pending（R4-G 未授权）。
  package-validation:
    runs-on: macos-latest
    needs: [device-build, signing-prep, package-ipa, package-deb]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download R4 artifacts
        uses: actions/download-artifact@v7
        with:
          path: build/r4-artifacts
      - name: Collect metadata and SHA256
        run: |
          set -o pipefail
          mkdir -p build/validation
          # 缺 artifact（上游 job 被跳过/失败）时记空路径，由归集脚本判 Pending；
          # 不允许 find 对缺失目录非零退出而中断元数据归档。
          # macOS uses BSD find; avoid GNU-only -maxdepth.
          find_first() {
            local dir="$1" pattern="$2"
            if [ -d "$dir" ]; then
              find "$dir" -name "$pattern" -print -quit 2>/dev/null || true
            fi
          }
          APP_PATH="$(find_first build/r4-artifacts/filterkit-device-build 'FilterKit.app')"
          IPA_PATH="$(find_first build/r4-artifacts/filterkit-ipa '*.ipa')"
          DEB_PATH="$(find_first build/r4-artifacts/filterkit-deb '*.ldid-signed-candidate.deb')"
          DEVICE_SUMMARY="$(find_first build/r4-artifacts/filterkit-device-build 'device-build-summary.json')"
          IPA_SUMMARY="$(find_first build/r4-artifacts/filterkit-ipa 'ipa-summary.json')"
          DEB_SUMMARY="$(find_first build/r4-artifacts/filterkit-deb 'deb-summary.json')"
          ENT_SUMMARY="$(find_first build/r4-artifacts/filterkit-signing-prep 'entitlements-summary.json')"
          APP_PATH="$APP_PATH" IPA_PATH="$IPA_PATH" DEB_PATH="$DEB_PATH" \
          DEVICE_SUMMARY="$DEVICE_SUMMARY" IPA_SUMMARY="$IPA_SUMMARY" \
          DEB_SUMMARY="$DEB_SUMMARY" ENT_SUMMARY="$ENT_SUMMARY" \
          PACKAGE_METADATA_PATH=build/validation/package-metadata.json \
            bash scripts/collect-package-metadata.sh 2>&1 | tee build/validation/metadata-collection.log
      - name: Verify metadata JSON decodable
        run: |
          python3 -c "import json; json.load(open('build/validation/package-metadata.json')); print('metadata JSON decodable')"
      - name: Upload package validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filterkit-package-validation
          path: |
            build/validation/metadata-collection.log
            build/validation/package-metadata.json
          retention-days: 14

  # 最小 App 编译与模拟器启动（Stage 2.1 App Target Integration）。
  # 步骤口径见 Spec/Stage-2/Stage-2.1-App-Target-Plan.md §7：
  # xcodegen generate → xcodebuild(iOS Simulator) → simctl boot/install/launch。
  # 边界：本步骤只验证 App 工程集成与基础启动；JBROOT / TweakInject / entitlement /
  # sandbox / jbroot() 等权限结论属 2.4，不在本 job 取证。
  #
  # 0.1-D-R1-A 恢复：App Build / 模拟器启动 / 存活复查 / dashboard.png 截图链路接回
  # 主流程（0.1-D 摘出期间置 if:false，工程定义与 App 源码一直保留）。
  app-build:
    runs-on: macos-latest
    needs: [build, isolation]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app for iOS Simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project FilterKit.xcodeproj -scheme FilterKit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build 2>&1 | tee build/app-xcodebuild.log
      - name: Locate built app
        id: app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name 'FilterKit.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::FilterKit.app not found under build/DerivedData"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Built app: $APP_PATH"
          ls -la "$APP_PATH"
      - name: Boot simulator, install and launch
        id: sim
        run: |
          set -euo pipefail
          DEVICE_LINE=$(xcrun simctl list devices available \
            | awk '/iPhone/ && /[0-9A-Fa-f-]{36}/ {print; exit}')
          if [ -z "$DEVICE_LINE" ]; then
            echo "::error::No available iPhone simulator found"
            exit 1
          fi
          DEVICE_ID=$(echo "$DEVICE_LINE" | grep -oE '[0-9A-Fa-f-]{36}' | head -1)
          DEVICE_NAME=$(echo "$DEVICE_LINE" | sed -E 's/ \([0-9A-Fa-f-]{36}\).*//; s/^ +//; s/ +$//')
          echo "Selected simulator: $DEVICE_NAME ($DEVICE_ID)"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl install "$DEVICE_ID" "${{ steps.app.outputs.app_path }}"
          LAUNCH_OUT=$(xcrun simctl launch "$DEVICE_ID" com.filterkit.manager)
          echo "$LAUNCH_OUT" | tee build/sim-launch.log
          APP_PID=$(echo "$LAUNCH_OUT" | grep -oE '[0-9]+' | head -1)
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "app_pid=$APP_PID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$DEVICE_ID" || true
      - name: Verify app alive and capture screenshot
        run: |
          set -euo pipefail
          DEVICE_ID="${{ steps.sim.outputs.device_id }}"
          APP_PID="${{ steps.sim.outputs.app_pid }}"
          BUNDLE=com.filterkit.manager
          # 留短暂窗口让 App 完成冷启动，再做存活复查（取证，不等同于稳定性验证）。
          sleep 3
          RUN_LIST=$(xcrun simctl spawn "$DEVICE_ID" launchctl list || true)
          ALIVE_LINE=$(echo "$RUN_LIST" | grep -E "$BUNDLE|FilterKit" || true)
          {
            echo "--- alive check $(date -u +%FT%TZ) ---"
            echo "device_id=$DEVICE_ID app_pid=$APP_PID bundle=$BUNDLE"
            echo "$ALIVE_LINE"
          } | tee -a build/sim-launch.log
          if [ -z "$ALIVE_LINE" ]; then
            echo "::error::App $BUNDLE not found in launchctl list after launch (PID $APP_PID may have exited)"
            exit 1
          fi
          ALIVE_PID=$(echo "$ALIVE_LINE" | awk '{print $1}')
          if [ "$ALIVE_PID" = "-" ] || [ -z "$ALIVE_PID" ]; then
            echo "::error::App $BUNDLE registered but PID is '-' (not running)"
            exit 1
          fi
          echo "App alive: PID $ALIVE_PID (launch PID $APP_PID)"
          xcrun simctl io "$DEVICE_ID" screenshot build/dashboard.png
          echo "Screenshot: build/dashboard.png"
      - name: Archive app build logs and product
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filterkit-app-build
          path: |
            build/app-xcodebuild.log
            build/sim-launch.log
            build/dashboard.png
            build/DerivedData/Build/Products/Debug-iphonesimulator/FilterKit.app
          retention-days: 14

  # C-F5：G8/G9/G10 模拟器交互取证（XCUITest）。被测 App 由 FilterKit target 构建；
  # 本 job 只做界面导航、导出链路与分享面板取证，不触发扫描、不读写越狱目录。
  #
  # 0.1-D-R1-A 恢复：XCUITest 交互/截图/导出容器拉取链路接回主流程（摘出期间
  # 置 if:false，`Tests/Stage2/UITests/` 源码、FilterKitUITests target 与
  # `Tools/ReportRoundtripValidator` 校验器一直保留）。
  ui-acceptance:
    runs-on: macos-latest
    needs: [app-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select simulator
        id: sim
        run: |
          DEVICE_LINE=$(xcrun simctl list devices available \
            | awk '/iPhone/ && /[0-9A-Fa-f-]{36}/ {print; exit}')
          if [ -z "$DEVICE_LINE" ]; then
            echo "::error::No available iPhone simulator found"
            exit 1
          fi
          DEVICE_ID=$(echo "$DEVICE_LINE" | grep -oE '[0-9A-Fa-f-]{36}' | head -1)
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $DEVICE_ID"
      - name: Run UI acceptance tests
        run: |
          set -o pipefail
          mkdir -p build/simulator build/export build/uitest
          xcodebuild test \
            -scheme FilterKitUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/uitest/FilterKitUITests.xcresult \
            2>&1 | tee build/uitest/ui-test.log
      - name: Pull exported report from simulator container
        if: always()
        run: |
          set -euo pipefail
          DEVICE_ID="${{ steps.sim.outputs.device_id }}"
          # xcodebuild test 结束后模拟器会被置为 Shutdown；未启动时
          # get_app_container 直接报 SimError 405（Unable to lookup in current
          # state: Shutdown，exit 149）。先拉起模拟器再查容器数据目录。
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE_ID" com.filterkit.manager data)
          mkdir -p build/export
          if ls "$CONTAINER/tmp"/FilterKit-Report-*.json >/dev/null 2>&1; then
            cp "$CONTAINER/tmp"/FilterKit-Report-*.json build/export/
          else
            echo "::warning::未在容器临时目录找到导出 JSON"
          fi
      - name: Validate exported report round-trip
        if: always()
        run: |
          set -euo pipefail
          REPORT=$(ls build/export/FilterKit-Report-*.json 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then
            echo "::error::缺少导出 JSON 样本，无法往返校验"
            exit 1
          fi
          swift run ReportRoundtripValidator --input "$REPORT" --output build/export/roundtrip-result.json
          shasum -a 256 build/export/FilterKit-Report-*.json build/export/roundtrip-result.json > build/export/SHA256SUMS
      - name: Upload UI acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filterkit-ui-acceptance
          path: |
            build/simulator
            build/export
            build/uitest
          retention-days: 14

  artifact:
    runs-on: macos-latest
    needs: [build, test, isolation, app-build, device-build, signing-prep, package-ipa, package-deb, package-validation]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: filterkit-build-metadata
          path: |
            Package.swift
            Makefile
            control
            project.yml
            Config/
            scripts/
            .github/workflows/
          retention-days: 14
