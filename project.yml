# XcodeGen 工程定义 — FilterKit（Stage 2.1 App Target Integration，待 runner 复验）
#
# 生成方式：runner 执行 `xcodegen generate` 产出 FilterKit.xcodeproj；
# 工程产物不提交入库（见 .gitignore）。口径依据：
# Spec/Stage-2/Stage-2.1-App-Target-Plan.md。
#
# 待确认项（不得视为已冻结）：
#   - B2 Deployment Target：草案 iOS 17.0，待链接 + 真机证据；
#   - B3 Bundle ID：草案 com.filterkit.manager，待命名确认；
#   - B4 UI 框架：首选 SwiftUI，若工具链不满足回退 UIKit。
#
# 模块接入：App target 只链接本地 SwiftPM 包产品 Models / Adapters / Core，
# 不复制第二套 Core 或 Models；依赖方向 App → Core → Models → Adapters。

name: FilterKit

options:
  bundleIdPrefix: com.filterkit
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  FilterKitCore:
    path: .

targets:
  FilterKit:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - README.md
          - Info.plist
          - "**/.gitkeep"
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        # 版本单一来源：App 营销版本取自 MARKETING_VERSION，构建号取自
        # CURRENT_PROJECT_VERSION。若不显式写入 Info.plist，Xcode 在缺键时
        # 回退默认 1.0/1（第四轮 Runner 实测 CFBundleShortVersionString=1.0）。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - package: FilterKitCore
        product: Models
      - package: FilterKitCore
        product: Adapters
      - package: FilterKitCore
        product: Core
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.filterkit.manager
      # 营销版本（CFBundleShortVersionString）；DEB control Version 基线必须与之
      # 一致（0.1.0），DEB 修订号 -1 仅为打包批次后缀，见 Config/DEB/control。
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_VERSION: "5.0"
      PRODUCT_NAME: FilterKit

  # C-F5：UI 验收测试 target（XCUITest）。仅驱动模拟器导航/导出/分享取证，
  # 不链接 Core 具体实现；被测 App 为上方 FilterKit target。
  FilterKitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/Stage2/UITests
    dependencies:
      - target: FilterKit
    settings:
      # UI 测试 bundle 无需自定义 Info.plist；由工程自动生成，避免代码签名阶段
      # 报 "target does not have an Info.plist file"（首轮 Runner 44471548011）。
      GENERATE_INFOPLIST_FILE: YES
